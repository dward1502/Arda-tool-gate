[package]
name = "tool-gate"
version = "0.1.0"
edition = "2021"
description = "Policy-gated tool invocation receipts for autonomous agents."
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["agents", "tools", "policy", "receipts", "cli"]
categories = ["command-line-utilities", "development-tools"]

[workspace]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
